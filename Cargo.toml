[package]
name = "ch58x-hal"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Pure Rust hardware abstraction for WCH CH58x microcontrollers"
repository = "https://github.com/rusted-ch5/ch58x-hal"
homepage = "https://github.com/rusted-ch5/ch58x-hal"
license = "MIT OR Apache-2.0"
keywords = ["wch", "qingke", "riscv", "embedded-hal", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["ch582"]
ch582 = ["qingke/v4"]
ch585 = ["qingke/v3"]

[dependencies]
ch58x = { version = "0.3", features = ["ch58x"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
portable-atomic = { version = "1.11", features = ["critical-section"] }
qingke = { version = "0.6.1", default-features = false }

[workspace]
